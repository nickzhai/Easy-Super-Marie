<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超级玛丽游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            touch-action: none;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background-color: transparent;
            touch-action: none;
        }
        
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -1;
        }
        
        #controls {
            margin-top: 10px;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        
        button {
            margin: 0 5px;
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: 5px;
        }
        
        #score {
            margin-bottom: 10px;
            font-size: 20px;
            color: white;
        }
        
        @media (max-width: 768px) {
            #controls {
                display: none; /* 在移动设备上隐藏物理按钮 */
            }
            
            #gameContainer {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <div id="score">得分: <span id="scoreValue">0</span></div>
    <div id="controls">
        <button id="pauseBtn">暂停(S)</button>
        <button id="restartBtn">重新开始(R)</button>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
