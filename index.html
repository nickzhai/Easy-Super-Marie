<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>超级玛丽游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        #backgroundContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #gameCanvas {
            position: absolute;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #score {
            position: fixed;
            top: env(safe-area-inset-top, 10px);
            left: env(safe-area-inset-left, 10px);
            font-size: min(24px, 5vw);
            color: #333;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            z-index: 100;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        
        .virtual-button {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(0, 0, 0, 0.2);
            color: #333;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .virtual-button:active {
            background-color: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        
        #pauseButton {
            bottom: 20px;
            right: 140px;
        }
        
        #restartButton {
            bottom: 20px;
            right: 20px;
        }
        
        @media (orientation: landscape) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
            }
            
            .virtual-button {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
            
            #pauseButton {
                bottom: 20px;
                right: 120px;
            }
            
            #restartButton {
                bottom: 20px;
                right: 20px;
            }
        }
        
        @media (orientation: portrait) {
            body::after {
                content: "请横屏使用以获得最佳体验";
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #333;
                font-size: 20px;
                text-align: center;
                background: rgba(255, 255, 255, 0.9);
                padding: 20px;
                border-radius: 10px;
                z-index: 1000;
            }
        }
        
        /* 针对 iPhone 刘海屏的适配 */
        @supports (padding: max(0px)) {
            #score {
                padding-left: max(10px, env(safe-area-inset-left));
                padding-top: max(10px, env(safe-area-inset-top));
            }
            
            .virtual-button {
                margin-top: max(0px, env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="backgroundContainer">
            <img class="background-image" src="background1.jpg" alt="背景">
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="pauseButton" class="virtual-button">⏸</div>
        <div id="restartButton" class="virtual-button">↺</div>
    </div>
    
    <div id="score">得分: <span id="scoreValue">0</span></div>
    
    <script src="game.js"></script>
</body>
</html>
